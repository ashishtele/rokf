# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at
# https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'

  # TEMPORARY: diagnose strict-validate failure on Windows. Remove after fix.
  debug-windows-validate:
    runs-on: windows-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")

      - name: Reproduce vignette bundle with diagnostics
        shell: Rscript {0}
        run: |
          library(rokf)
          kb <- file.path(tempdir(), "dbg-kb")
          cat("KB PATH:", kb, "\n")
          rokf::okf_init(kb)
          rokf::okf_create("decisions/cache-ttl", bundle = kb,
            type = "Decision", title = "Redis Cache TTL",
            desc = "Default TTL 300s for session data")
          rokf::okf_create("decisions/session-store", bundle = kb,
            type = "Architecture", title = "Session Store",
            desc = "Sessions live in Redis behind the API gateway")
          rokf::okf_relate("decisions/cache-ttl", "decisions/session-store",
            bundle = kb, desc = "TTL applies to the session store")
          cat("=== SOURCE BODY ===\n")
          cat(rokf::okf_show("decisions/cache-ttl", bundle = kb)$body, "\n")
          cat("=== BUNDLE FILES ===\n")
          print(list.files(kb, recursive = TRUE))
          cat("=== NON-STRICT (raw) ===\n")
          bin <- rokf:::okf_bin()
          res_ns <- processx::run(bin, c("validate", kb, "--json"),
            error_on_status = FALSE)
          cat("exit:", res_ns$status, "\n")
          cat(res_ns$stdout, "\n")
          cat("=== STRICT (raw) ===\n")
          res_s <- processx::run(bin, c("validate", kb, "--strict", "--json"),
            error_on_status = FALSE)
          cat("exit:", res_s$status, "\n")
          cat(res_s$stdout, "\n")
